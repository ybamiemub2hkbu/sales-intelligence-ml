[project]
name = "salesml"
version = "1.0.0"
description = "Sales Intelligence ML: forecasting, segmentation, churn, CLV, pricing, basket, anomaly and promotion analytics on retail sales data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.4", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["salesml*"]

[tool.setuptools.package-data]
salesml = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*deprecated.*:Warning"]
